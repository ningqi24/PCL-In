name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_tag:
        required: false
        type: string
        default: ''
        description: 发布 tag（如 v1.0.1）；非空时按其重写 metadata.json 的版本号

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Describe
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Generate metadata version from tag
        if: inputs.version_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if not tag:
              sys.exit(0)

          version = tag[1:] if tag[:1] in ("v", "V") else tag
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?", version)
          if not match:
              sys.exit(f"::error::无法从 tag {tag!r} 解析版本号（应为 v1.2.3 或 v1.2.3-beta.1）")

          major, minor, patch = (int(match.group(i)) for i in (1, 2, 3))
          suffix = match.group(4) or ""
          pre = int(m.group(1)) if (m := re.search(r"(\d+)$", suffix)) else 0

          # 与 GitHubReleasesUpdateSource 计算远端 version code 的公式保持一致
          code = major * 1_000_000 + minor * 10_000 + patch * 100 + pre

          path = pathlib.Path("Plain Craft Launcher 2/metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"].update(base=f"{major}.{minor}.{patch}", suffix=suffix, code=code)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"metadata.json <- {tag}: base={major}.{minor}.{patch} suffix={suffix or '(空)'} code={code}")
          PY

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
          -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
          -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-In-${{ inputs.architecture == 'ARM64' && 'arm64' || 'x64' }}
          path: artifact/**
