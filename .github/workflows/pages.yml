name: PCL-In Download Site (GitHub Pages)

on:
  push:
    branches: [dev]
    paths:
      - 'download/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (download/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: download

      - name: Deploy
        uses: actions/deploy-pages@v4
